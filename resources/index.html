<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <button id="btn-open-about" class="btn btn-mode">ℹ️ Acerca de</button>
    <div class="app-container">
        <div class="mode-label">POMODORO</div>
        <div class="timer-circle">
            <span id="timerDisplay" class="time-display">25:00</span>
        </div>
        <div class="controls">
            <button class="btn btn-start" data-isselected="false" id="start-button" onclick="handleStartOrPause(this)">Start</button>
            <button class="btn" onclick="resetTimer(this)">Reset</button>
        </div>
        <div class="controls">
            <button id="btn-initial-focus" class="btn btn-mode active" onclick="setAsPomodoro(this)">Pomodoro</button>
            <button id="btn-initial-break" class="btn btn-mode" onclick="setAsBreak(this)">Short Break</button>
            <!-- <button class="btn btn-mode">Long Break</button> -->
        </div>
    </div>

    <div id="about-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title">Pomodoro Minimal</h2>
                <button class="btn-close" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <p class="app-version">v1.0.0</p>
                <p class="app-desc">Temporizador Pomodoro diseñado para la concentración profunda.</p>
                <div class="dev-info">
                    <span class="label">Desarrollado por</span>
                    <span class="name">Tu Nombre</span>
                    <a href="#" class="link">github.com/tuusuario</a>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary js-close-modal">Entendido</button>
            </div>
        </div>
    </div>

    <script src="/js/neutralino.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
